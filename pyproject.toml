[project]
name = "fastapi-authx-sample"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "authx>=1.7.1",
    "fastapi>=0.128.8",
    "psycopg>=3.2.13",
    "pydantic>=2.13.4",
    "uvicorn>=0.39.0",
    "websockets>=15.0.1",
    "minio>=7.2.14",
    "python-multipart>=0.0.9",
    "urllib3>=2.6.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.0.0",
    "pytest>=8.4.2",
]
